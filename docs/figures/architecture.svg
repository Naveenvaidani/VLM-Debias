<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>Connector study architecture: frozen SigLIP features, four swappable connectors, Qwen3.5-4B / Phi-4-mini with LoRA</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Same LLM, same features, same data: only the connector changes</text>

  <!-- image + encoder -->
  <rect x="30" y="200" width="120" height="90" rx="8" fill="#f3f3f3" stroke="#888"/>
  <text x="90" y="238" text-anchor="middle" font-size="14" fill="#222">Image</text>
  <text x="90" y="258" text-anchor="middle" font-size="11" fill="#555">bird on water /</text>
  <text x="90" y="273" text-anchor="middle" font-size="11" fill="#555">watermark corner</text>
  <line x1="150" y1="245" x2="188" y2="245" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="190" y="190" width="140" height="110" rx="8" fill="#e6eefb" stroke="#2a78d6"/>
  <text x="260" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4f8f">SigLIP encoder</text>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#333">frozen, features cached</text>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#333">base: 196 × 768</text>
  <text x="260" y="282" text-anchor="middle" font-size="11" fill="#333">large: 256 × 1024</text>
  <line x1="330" y1="245" x2="368" y2="245" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- connectors -->
  <rect x="370" y="60" width="270" height="440" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="6 4"/>
  <text x="505" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Connector (the only variable)</text>
  <rect x="385" y="95" width="240" height="78" rx="6" fill="#e6eefb" stroke="#2a78d6"/>
  <text x="505" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4f8f">MLP projector (LLaVA)</text>
  <text x="505" y="137" text-anchor="middle" font-size="11" fill="#333">2×2 pool → LN-Linear-GELU-Linear</text>
  <text x="505" y="154" text-anchor="middle" font-size="11" fill="#333">49 image tokens prepended, 8.5M</text>
  <rect x="385" y="183" width="240" height="78" rx="6" fill="#fdeee5" stroke="#eb6834"/>
  <text x="505" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#a2461f">Q-Former (BLIP-2)</text>
  <text x="505" y="225" text-anchor="middle" font-size="11" fill="#333">32 learned queries attend patches</text>
  <text x="505" y="242" text-anchor="middle" font-size="11" fill="#333">32 image tokens prepended, 11.4M</text>
  <rect x="385" y="271" width="240" height="100" rx="6" fill="#e3f6ee" stroke="#1baf7a"/>
  <text x="505" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#137a55">Cross-attn, learned gate</text>
  <text x="505" y="313" text-anchor="middle" font-size="11" fill="#333">prompt tokens attend patches</text>
  <text x="505" y="330" text-anchor="middle" font-size="11" fill="#333">e ← e + tanh(α)·attn,  α₀ = 0</text>
  <text x="505" y="350" text-anchor="middle" font-size="11" fill="#b00020" font-weight="bold">α stays ≈ 0.0005 → gate shut</text>
  <text x="505" y="364" text-anchor="middle" font-size="11" fill="#333">0 image tokens, 8.9M</text>
  <rect x="385" y="381" width="240" height="100" rx="6" fill="#efeafb" stroke="#7a5bd6"/>
  <text x="505" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#563f9e">Cross-attn, fixed gate</text>
  <text x="505" y="423" text-anchor="middle" font-size="11" fill="#333">same block, gate fixed open</text>
  <text x="505" y="440" text-anchor="middle" font-size="11" fill="#333">output layer zero-initialised</text>
  <text x="505" y="458" text-anchor="middle" font-size="11" fill="#137a55" font-weight="bold">identity at start, cannot close</text>
  <text x="505" y="473" text-anchor="middle" font-size="11" fill="#333">0 image tokens, 8.9M</text>

  <!-- LLM -->
  <line x1="640" y1="245" x2="678" y2="245" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="680" y="170" width="160" height="150" rx="8" fill="#fff6d9" stroke="#c99a00"/>
  <text x="760" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5d00">LLM</text>
  <text x="760" y="224" text-anchor="middle" font-size="11" fill="#333">Qwen3.5-4B / Phi-4-mini</text>
  <text x="760" y="242" text-anchor="middle" font-size="11" fill="#333">NF4 4-bit + LoRA r16</text>
  <text x="760" y="262" text-anchor="middle" font-size="11" fill="#333">prompt: "Is the bird a</text>
  <text x="760" y="278" text-anchor="middle" font-size="11" fill="#333">landbird or a waterbird?"</text>
  <line x1="840" y1="245" x2="868" y2="245" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="870" y="205" width="78" height="80" rx="8" fill="#f3f3f3" stroke="#888"/>
  <text x="909" y="236" text-anchor="middle" font-size="12" fill="#222">answer</text>
  <text x="909" y="253" text-anchor="middle" font-size="11" fill="#555">2-token</text>
  <text x="909" y="268" text-anchor="middle" font-size="11" fill="#555">logits</text>

  <!-- training stages -->
  <rect x="30" y="512" width="900" height="38" rx="6" fill="#f7f7f7" stroke="#bbb"/>
  <text x="480" y="536" text-anchor="middle" font-size="12" fill="#222">Stage 1: align connector on 10k COCO captions (LLM frozen)  →  Stage 2: task training, LoRA + connector  →  Stage 3 (optional): connector-only DFR / JTT</text>
</svg>
